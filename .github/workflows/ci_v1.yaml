name: CI

on: 
  push:
    branches:
      - main
# on es el gatillador en ese pipeline, ¿qué acción va a ser el usuario para que
# ese trigger se ejecute? se define tambien en que rama del repositorio se ejecuta
# el pipeline. En este caso decimos que el pipeline se va a ejecutar/gatillar cuando
# el usuario haga push en el repositorio pero en las ramas: 'main'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      # ese primer paso es obligatorio porque este checkout lo que hace por defecto
      # es clonar el proyecto que está en nuestro repositorio a la máquina virtual
      # que esta habilitando github.

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
      # aca lo que se está ejecutando en esta acción precargada, por atrás 
      # ejecuta todos los comandos necesarios para instalar python en la VM

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      # instala pytest en la VM
      # con 'run' ejecutas comandos
      
      - name: Run tests
        run: |
          python -m pytest tests/test_main_v1.py

      # correr los test con pytest
      

  # es un job, dentro de cada job tiene subtareas, si fuera un pipeline de vertex
  # ese pipeline tiene tareas o componentes, el job es el general
  # dentro de este job llamado 'test' vamos a tener varios pasos/steps o componentes
  # se puede tener varios jobs pero cada job tendrá pasos a seguir
  # ubuntu-latest define bajo que sistema operativo se ejecuta el código,
  # no es que se ejecuta en github, sino que ella habilita una maquina virtual por atras
  # y aquí se define el sistema operativo de esa máquina
  # Cada steps tiene un nombre y luego tiene lo que va a ejecutar, puede ser código
  # o acción pre-construida, básicamente es como si estuvieras importando una librería