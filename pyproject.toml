[project]
name = "curso-githubactions"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = []


[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "F", # pyflakes
    "I", # isort
    "B", #flake8-bugbear
    "UP", #pyupgrade
]
ignore = [
    "E501", # line too long; normalmente lo maneja el formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = [
    "test_*.py",
    "*_test.py",
    ]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --tb=short --cov-report=term-missing"

# -v       verbose
# -q       quiet
# -ra      resumen adicional de tests
# -x       detenerse en el primer fallo
# --tb=short     traceback más corto

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]
